{% set name = "ansys-platform-instancemanagement" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ansys_platform_instancemanagement-{{ version }}.tar.gz
  sha256: dcff3b759bec05a8d0029d9e74b97b469738739dc8444568fbd20ca31a9b37e0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >={{ python_min }}
    - importlib-metadata >=4.0
    - ansys-api-platform-instancemanagement >=1.0,<2.dev0

test:
  imports:
    - ansys.platform.instancemanagement
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: A Python wrapper for Ansys platform instancemanagement
  home: https://pypim.docs.pyansys.com/
  dev_url: https://github.com/pyansys/pypim
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - RobPasMue
    - jorgepiloto
    - SMoraisAnsys
    - MaxJPRey
